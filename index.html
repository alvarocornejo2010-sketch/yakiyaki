<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera superficie-tinta">
  <div class="contenedor cabecera__fila">
    <a class="cabecera__logo" href="#inicio"><img src="img/marca/logo-sobre-oscuro.svg" alt="Yaki Yaki, ir al inicio" width="226" height="239"></a>
    <div class="cabecera__extra" data-cabecera-extra hidden></div>
    <nav class="cabecera__nav" id="menu-principal" aria-label="Principal">
      <ul>
        <li><a class="nav-enlace" href="#carta" data-t="menu.carta">Carta</a></li>
        <li><a class="nav-enlace" href="#favoritos" data-t="menu.favoritos">Favoritos</a></li>
        <li><a class="nav-enlace" href="#nosotros" data-t="menu.nosotros">Nosotros</a></li>
        <li><a class="nav-enlace" href="#ubicacion" data-t="menu.ubicacion">Ubicación</a></li>
      </ul>
    </nav>
    <button class="boton boton--primario boton--chico cabecera__pedir" type="button" data-abrir-pedido data-con-contador><span data-t="menu.pedir">Pedir ahora</span></button>
    <button class="cabecera__menu" type="button" aria-expanded="false" aria-controls="menu-principal">
      <svg class="icono" aria-hidden="true"><use href="#i-menu"/></svg><span>Menú</span>
    </button>
  </div>
</header>

<noscript><p class="sin-js">Para ver la carta y pedir, activa JavaScript. También puedes escribir por WhatsApp al <a href="https://wa.me/51912848007">912 848 007</a>.</p></noscript>

<main id="contenido">

  <!-- Portada -->
  <section class="hero superficie-tinta" id="inicio" aria-labelledby="portada-titulo">
    <div class="hero__fondo" aria-hidden="true">
      <!-- [PROVISIONAL] Plato recortado de su publicación. Va la foto nocturna de ramen cuando llegue. -->
      <div class="hero__plato">
        <img src="img/carta/ramen.webp" alt="" width="610" height="610" fetchpriority="high">
        <div class="vapor"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="contenedor">
      <div class="hero__contenido">
        <h1 class="hero__marca" id="portada-titulo" data-nombre></h1>
        <p class="sello" data-t="portada.sello"></p>
        <p class="titulo hero__titulo" data-portada-titulo></p>
        <p class="bajada" data-portada-bajada></p>
        <div class="hero__acciones">
          <a class="boton boton--primario" href="#carta" data-t="portada.verCarta"></a>
          <button class="boton boton--secundario" type="button" data-abrir-pedido data-t="portada.pedir"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Favoritos -->
  <section class="seccion superficie-crema" id="favoritos" aria-labelledby="favoritos-titulo">
    <div class="contenedor">
      <h2 class="titulo titulo--m seccion__titulo" id="favoritos-titulo" data-t="favoritos.titulo"></h2>
      <div class="rejilla-tickets" data-lista="favoritos"></div>
    </div>
  </section>

  <!-- Combos -->
  <section class="seccion superficie-tinta" id="combos" aria-labelledby="combos-titulo">
    <div class="contenedor">
      <div class="seccion__cabeza">
        <h2 class="titulo titulo--m" id="combos-titulo" data-t="combos.titulo"></h2>
        <p class="bajada" data-t="combos.bajada"></p>
      </div>
      <ul class="combos" data-lista="combos" aria-labelledby="combos-titulo" tabindex="0"></ul>
    </div>
  </section>

  <!-- Nosotros -->
  <section class="seccion superficie-crema" id="nosotros" aria-labelledby="nosotros-titulo">
    <div class="contenedor nosotros">
      <h2 class="titulo titulo--m nosotros__titulo" id="nosotros-titulo" data-t="nosotros.titulo"></h2>
      <p class="bajada nosotros__texto" data-nosotros-texto></p>
      <ul class="carrusel" data-lista="galeria" aria-label="Fotos de Yaki Yaki" tabindex="0"></ul>
    </div>
  </section>

  <!-- Carta -->
  <section class="seccion superficie-crema seccion--borde" id="carta" aria-labelledby="carta-titulo">
    <div class="contenedor">
      <div class="seccion__cabeza">
        <h2 class="titulo titulo--m" id="carta-titulo" data-t="carta.titulo"></h2>
        <p class="nota-precios" data-nota-precios></p>
      </div>
      <div class="carta" data-lista="carta"></div>
    </div>
  </section>

  <!-- Arma tu YakiBox -->
  <section class="yakibox superficie-turquesa" id="yakibox" aria-labelledby="yakibox-titulo">
    <p class="palabra-gigante" aria-hidden="true" data-t="yakibox.palabra"></p>
    <div class="contenedor yakibox__rejilla">
      <div class="yakibox__fotos" data-lista="yakibox-fotos"></div>
      <div class="yakibox__contenido">
        <h2 class="titulo titulo--m" id="yakibox-titulo" data-t="yakibox.titulo"></h2>
        <p class="bajada" data-t="yakibox.bajada"></p>
        <form class="pasos" data-lista="yakibox-pasos" aria-labelledby="yakibox-titulo"></form>
        <button class="boton boton--primario" type="button" data-abrir-pedido data-producto-desde="yakibox" data-t="yakibox.boton"></button>
        <p class="yakibox__error" data-yakibox-error role="alert" hidden></p>
      </div>
    </div>
  </section>

  <!-- Ubicación y pedidos -->
  <section class="seccion superficie-tinta" id="ubicacion" aria-labelledby="ubicacion-titulo">
    <div class="contenedor ubicacion">
      <div class="ubicacion__info">
        <div class="seccion__cabeza">
          <h2 class="titulo titulo--m" id="ubicacion-titulo" data-t="ubicacion.titulo"></h2>
          <p class="estado" data-estado hidden></p>
        </div>
        <div class="ubicacion__bloque">
          <h3 class="ubicacion__subtitulo" data-t="ubicacion.direccion"></h3>
          <address class="ubicacion__direccion" data-direccion></address>
          <div class="ubicacion__acciones">
            <a class="boton boton--secundario boton--chico" data-como-llegar target="_blank" rel="noopener"><svg class="icono" aria-hidden="true"><use href="#i-pin"/></svg><span data-t="ubicacion.comoLlegar"></span></a>
            <a class="boton boton--secundario boton--chico" data-whatsapp-boton target="_blank" rel="noopener" hidden><svg class="icono" aria-hidden="true"><use href="#i-whatsapp"/></svg><span data-t="ubicacion.whatsapp"></span></a>
          </div>
        </div>
        <div class="ubicacion__bloque">
          <h3 class="ubicacion__subtitulo" data-t="ubicacion.horario"></h3>
          <dl class="horario" data-horario></dl>
        </div>
        <div class="ubicacion__bloque">
          <h3 class="ubicacion__subtitulo" data-t="ubicacion.pedidos"></h3>
          <ul class="canales" data-lista="canales"></ul>
        </div>
      </div>
      <!-- El mapa se crea desde js/sitio.js (con la dirección de data/negocio.js) -->
      <div class="ubicacion__mapa" data-mapa-caja>
        <p class="ubicacion__mapa-texto" data-mapa-texto></p>
      </div>
    </div>
  </section>

  <!-- Marcas hermanas: solo aparece si marcasHermanas.mostrar es true -->
  <section class="seccion superficie-crema" id="marcas" aria-labelledby="marcas-titulo" hidden>
    <div class="contenedor">
      <h2 class="titulo titulo--m seccion__titulo" id="marcas-titulo" data-t="marcas.titulo"></h2>
      <ul class="marcas" data-lista="marcas"></ul>
    </div>
  </section>
</main>

<footer class="pie superficie-tinta">
  <div class="contenedor pie__rejilla">
    <div class="pie__marca">
      <img src="img/marca/logo-sobre-oscuro.svg" alt="" width="226" height="239" loading="lazy">
      <p><strong data-nombre></strong><br><span data-descriptor></span></p>
    </div>
    <div>
      <h2 class="pie__titulo" data-t="ubicacion.direccion"></h2>
      <address class="pie__texto" data-direccion></address>
      <a class="nav-enlace pie__red" data-whatsapp-texto target="_blank" rel="noopener" hidden><svg class="icono" aria-hidden="true"><use href="#i-whatsapp"/></svg><span></span></a>
    </div>
    <div>
      <h2 class="pie__titulo" data-t="pie.redes"></h2>
      <ul class="pie__lista" data-lista="redes"></ul>
    </div>
    <div>
      <h2 class="pie__titulo" data-t="pie.secciones"></h2>
      <ul class="pie__lista">
        <li><a class="nav-enlace" href="#carta" data-t="menu.carta"></a></li>
        <li><a class="nav-enlace" href="#favoritos" data-t="menu.favoritos"></a></li>
        <li><a class="nav-enlace" href="#nosotros" data-t="menu.nosotros"></a></li>
        <li><a class="nav-enlace" href="#ubicacion" data-t="menu.ubicacion"></a></li>
      </ul>
    </div>
  </div>
  <div class="contenedor pie__legal">
    <p data-nota-precios></p>
    <p>© <span data-anio></span> <span data-nombre></span></p>
  </div>
</footer>

<!-- Barra fija de celular: aparece al dejar la portada -->
<div class="barra-pedido superficie-tinta" data-despues-de="#inicio" data-lista="barra"></div>

<!-- Hoja de pedido -->
<dialog class="hoja" id="hoja-pedido" aria-labelledby="hoja-titulo">
  <div class="hoja__interior">
    <div class="hoja__cabeza">
      <h2 class="titulo titulo--s" id="hoja-titulo" data-t="pedido.titulo"></h2>
      <button class="boton-cerrar" type="button" data-cerrar-pedido><svg class="icono" aria-hidden="true"><use href="#i-cerrar"/></svg><span class="solo-lectores">Cerrar</span></button>
    </div>
    <p class="hoja__producto" data-hoja-producto hidden></p>
    <div class="carrito" data-carrito hidden></div>
    <div class="hoja__otros">
      <p class="hoja__otros-titulo" data-otros-titulo hidden></p>
      <ul class="canales" data-lista="canales"></ul>
    </div>
    <div class="hoja__pie">
      <p data-recoger></p>
      <p class="estado" data-estado hidden></p>
    </div>
  </div>
</dialog>

<!-- Elegir sabor, tamaño y cantidad antes de agregar -->
<dialog class="hoja" id="hoja-agregar" aria-labelledby="agregar-titulo">
  <form class="hoja__interior" data-form-agregar novalidate>
    <div class="hoja__cabeza">
      <h2 class="titulo titulo--s" id="agregar-titulo"></h2>
      <button class="boton-cerrar" type="button" data-cerrar-agregar><svg class="icono" aria-hidden="true"><use href="#i-cerrar"/></svg><span class="solo-lectores">Cerrar</span></button>
    </div>
    <div class="agregar__campos" data-agregar-campos></div>
    <p class="agregar__error" data-agregar-error role="alert" hidden></p>
    <button class="boton boton--primario agregar__confirmar" type="submit" data-agregar-confirmar data-t="pedido.agregarAlPedido">Agregar al pedido</button>
  </form>
</dialog>

<!-- Aviso al agregar un plato -->
<div class="aviso superficie-tinta" data-aviso hidden></div>
<p class="solo-lectores" data-anuncio role="status" aria-live="polite"></p>

<script src="data/negocio.js"></script>
<script src="data/carta.js"></script>
<script src="js/sitio.js"></script>
<script src="js/pedido.js"></script>
<script src="js/componentes.js"></script>
</body>
